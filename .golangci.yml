version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - revive
    - misspell
  exclusions:
    rules:
      # Tests may use looser patterns (temp files, permissions, etc.).
      - path: _test\.go
        linters:
          - gosec
formatters:
  enable:
    - gofmt
    - goimports
