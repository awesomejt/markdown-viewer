services:
  mdv:
    build:
      context: .
      args:
        VERSION: ${MDV_VERSION:-dev}
    image: mdv:${MDV_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${MDV_PORT:-8080}:8080"
    # Must match the uid=/gid= options of the NAS mount on the VM so the
    # container user can read it. 1000:1000 is the documented default; the real
    # NAS values are still an open question.
    user: "${MDV_UID:-1000}:${MDV_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      MDV_LISTEN: ":8080"
      MDV_ROOTS: ${MDV_ROOTS:-examples=/data/examples}
      MDV_POLL_INTERVAL: ${MDV_POLL_INTERVAL:-2s}
      MDV_LOG_LEVEL: "info"
      # Extra Host names to accept (IP literals and localhost always pass).
      MDV_ALLOWED_HOSTS: ${MDV_ALLOWED_HOSTS:-}
      # Global preferences file (optional; a missing file means defaults).
      MDV_PREFS: ${MDV_PREFS:-/config/preferences.yaml}
    volumes:
      - ./examples:/data/examples:ro
      - ./config:/config:ro
      # NAS share mounted on the VM (fstab/autofs). Bind the PARENT of the mount
      # point: rslave only propagates mounts made beneath the source. With the
      # share at /mnt/nas/markdown, set MDV_ROOTS=markdown=/data/nas/markdown; a
      # late or remounted NAS then appears without recreating the container.
      # create_host_path: false stops Docker creating an empty source dir.
      # - type: bind
      #   source: /mnt/nas
      #   target: /data/nas
      #   read_only: true
      #   bind:
      #     propagation: rslave
      #     create_host_path: false
    healthcheck:
      test: ["CMD", "/mdv", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
